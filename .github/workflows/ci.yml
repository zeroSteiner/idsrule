name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.24.x', '1.25.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          # `config verify` downloads its JSON schema from golangci-lint.run
          # on every run; when that site is slow the job fails before any
          # linter runs. The config is checked by `golangci-lint run` itself.
          verify: false

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./lexer -run='^$' -fuzz=FuzzLex -fuzztime=10s
      - run: go test ./parser -run='^$' -fuzz=FuzzParse -fuzztime=10s
